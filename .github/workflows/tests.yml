name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
